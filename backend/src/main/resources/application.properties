server.port=${PORT:8080}

# Local development uses an in-memory database. Configure the PostgreSQL URL
# and credentials with environment variables to use Amazon RDS.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:biomed;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.aws.region=${AWS_REGION:ap-south-1}
app.aws.s3.bucket-name=${S3_BUCKET_NAME:}
app.datasets.import-token=${DATASET_IMPORT_TOKEN:}
app.datasets.max-file-bytes=${DATASET_MAX_FILE_BYTES:262144000}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=251MB
